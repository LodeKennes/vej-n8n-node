name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: mkdir -p artifacts && bun pm pack --destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: n8n-nodes-vej
          path: artifacts/*.tgz
          if-no-files-found: error
